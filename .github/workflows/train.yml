name: Train DeepFusion
on:
  workflow_dispatch:
  push:
    paths:
      - "training/**"
      - "models/**"
      - "features/**"
  schedule:
    - cron: "0 */6 * * *"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run training
        run: python -m training.train_deepfusion
      - name: Run backtest
        run: python -m evaluation.backtest_600
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ logs/ evaluation/
          if ! git diff --cached --quiet; then
            git commit -m "chore(model): update DeepFusion training results"
            git push
          fi
