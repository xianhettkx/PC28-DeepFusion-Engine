name: Train DeepFusion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "training/**"
      - "models/**"
      - "features/**"
      - "evaluation/**"
permissions:
  contents: write
concurrency:
  group: deepfusion-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu
          python -m pip install numpy pandas scikit-learn
      - name: Train from random initialization
        run: python -m training.train_deepfusion
      - name: Run 600-draw walk-forward backtest
        run: python -m evaluation.backtest_600
      - name: Commit model and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/*.pt logs/ evaluation/reports/
          if ! git diff --cached --quiet; then
            git commit -m "chore(model): train DeepFusion and record walk-forward results"
            git push
          fi
