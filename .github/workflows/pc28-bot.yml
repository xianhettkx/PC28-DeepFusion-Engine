name: PC28 Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/pc28-bot.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: pc28-telegram-long-poll
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout latest PC28 engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Telegram runtime
        run: python -m pip install --upgrade "python-telegram-bot[job-queue]==21.6"

      - name: Check required secret
        id: check_required_secret
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "::error::Repository secret TG_TOKEN is missing."
            exit 1
          fi

      - name: Keep Telegram polling online (5h 40m maximum)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BOT_ADMIN_IDS: ${{ vars.BOT_ADMIN_IDS }}
          BOT_POLL_SECONDS: "60"
          BOT_AUTO_GIT_PULL: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 20400s python -u -m bot.main
          code=$?
          echo "Bot process ended with exit code: $code"
          # 124 is the expected timeout after the planned 5h40m session.
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 143 ]; then
            exit "$code"
          fi

      - name: Persist subscriber and notification state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/subscribers.json bot/runtime_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist PC28 Telegram bot state"
            git push
          else
            echo "No bot state changes to persist."
          fi

      - name: Queue the next long-poll session
        if: always() && steps.check_required_secret.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/pc28-bot.yml/dispatches" \
            -d '{"ref":"main"}'
