name: PC28 data sync and training gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "prediction/**"
      - ".github/workflows/pc28-data-sync.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: pc28-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 41
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu
          python -m pip install numpy pandas scikit-learn
      - name: Validate parser and synchronize latest draws
        env:
          PC28_API_URL: https://pc28.help/api/kj.json?nbr=100
        run: |
          python -m compileall -q training models features evaluation prediction engine
          python -m unittest discover -s engine -p 'test_*.py' -v
          python engine/sync.py
      - name: Validate all frozen prediction plans against new results
        run: python -m prediction.validate_plans
      - name: Train only after 20 new draws
        id: train
        shell: bash
        run: |
          set -o pipefail
          python -m training.train_deepfusion --if-new-20 | tee /tmp/train-output.txt
          if grep -q '"status": "trained"' /tmp/train-output.txt; then
            echo "trained=true" >> "$GITHUB_OUTPUT"
          else
            echo "trained=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run 600-draw walk-forward evaluation after a new training run
        if: steps.train.outputs.trained == 'true'
        run: python -m evaluation.backtest_600
      - name: Generate and freeze the next 20-draw prediction plan
        if: steps.train.outputs.trained == 'true'
        run: python -m prediction.generate_plan
      - name: Validate the newly frozen plan (must have zero outcomes initially)
        if: steps.train.outputs.trained == 'true'
        run: python -m prediction.validate_plans
      - name: Create the initial frozen 20-draw plan if none exists
        shell: bash
        run: |
          mkdir -p prediction/plans
          if ! compgen -G "prediction/plans/*.json" > /dev/null; then
            python -m prediction.generate_plan
            python -m prediction.validate_plans
          else
            echo "A frozen prediction plan already exists; it will not be replaced."
          fi
      - name: Commit data, model, reports and immutable plans
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ models/ logs/ evaluation/ prediction/
          if ! git diff --cached --quiet; then
            git commit -m "chore(engine): sync data, validate forecasts and update model"
            git push
          else
            echo "No dataset/model/forecast changes."
          fi
